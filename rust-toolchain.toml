# rust-toolchain.toml — pinnt die Rust-Toolchain für dieses Projekt
#
# OS-Entwicklung braucht Nightly-Rust, weil wir instabile Features nutzen
# (eigenes Test-Framework, build-std). Diese Datei sorgt dafür, dass
# cargo in diesem Ordner automatisch nightly verwendet — egal, was
# systemweit als Standard eingestellt ist.

[toolchain]
channel = "nightly"
components = [
    "rust-src",            # braucht der bootloader-Host-Build für seine BIOS-Stages
    "llvm-tools-preview",  # LLVM-Werkzeuge für die Bootloader-Stage-Builds
]
targets = [
    "x86_64-unknown-none", # das eingebaute Bare-Metal-Target unseres Kernels
]
