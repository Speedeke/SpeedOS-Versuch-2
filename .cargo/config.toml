# .cargo/config.toml — Build-Konfiguration für SpeedOS
#
# Seit der Migration auf bootloader 0.11 herrlich kurz:
#  1. Der Kernel baut für das EINGEBAUTE Rust-Target
#     x86_64-unknown-none (Bare Metal, soft-float) — rustup liefert
#     vorkompilierte core/alloc, kein build-std, kein eigenes
#     Target-JSON mehr nötig.
#  2. `cargo run`/`cargo test` übergeben den fertigen Kernel-ELF an
#     unser boot/-Programm: Das baut daraus ein bootfähiges
#     BIOS-Disk-Image und startet QEMU (im Test-Modus headless mit
#     isa-debug-exit und Exit-Code-Auswertung).
#     Das explizite Host-Target im Runner-Aufruf ist nötig, weil sonst
#     das [build]-Target auch fürs Host-Programm gelten würde.

[build]
target = "x86_64-unknown-none"

# `cargo image` baut das USB-LIVE-Image (speedos-live.img) — ein
# bootfähiges UEFI-GPT-Image ohne QEMU/Platten, das man auf einen
# Stick schreibt (Anleitung: docs/usb-boot.md). Das Host-Programm
# live-image (im boot/-Workspace) baut den Kernel selbst und ruft
# bootloader::UefiBoot; --target zwingt es aufs Windows-Target (sonst
# würde das [build]-Bare-Metal-Target auch dafür gelten). `--` reicht
# eigene Argumente durch, z. B. `cargo image -- --release`.
[alias]
image = [
    "run",
    "--quiet",
    "--manifest-path",
    "boot/Cargo.toml",
    "--bin",
    "live-image",
    "--target",
    "x86_64-pc-windows-msvc",
    "--",
]

[target.'cfg(target_os = "none")']
runner = [
    "cargo",
    "run",
    "--quiet",
    "--manifest-path",
    "boot/Cargo.toml",
    "--target",
    "x86_64-pc-windows-msvc",
    "--",
]
