# userland/Cargo.toml — Die USER-SPACE-Welt von SpeedOS (Serie 6, Teil 5)
#
# Das hier ist die andere Seite der Syscall-Grenze. Kein Kernel-Code, keine
# Kernel-Typen, kein `speed_os`-Crate als Abhängigkeit — diese Programme
# kennen SpeedOS ausschliesslich durch die 23 Zahlen aus docs/syscalls.md.
# Genau das ist der Beweis, dass die ABI trägt: Wäre hier auch nur EIN
# `use speed_os::...`, wäre es kein User-Space, sondern Kernel-Code in einer
# anderen Datei.
#
# EIGENER WORKSPACE (wie boot/): Der Kernel-Workspace darf diese Crates nicht
# mitbauen — sie brauchen ein eigenes Linker-Skript und werden vom
# build.rs des Kernels gezielt gebaut und eingebettet.

[package]
name = "libspeed"
version = "0.1.0"
edition = "2021"
description = "Die Standard-Bibliothek der SpeedOS-Programme (no_std)"

# Nicht Teil des Kernel-Workspaces (der excludet uns zusätzlich).
[workspace]

[dependencies]
# DER HTTP-PARSER (Serie 7, Teil 4). Das ist DERSELBE Code, den der Kernel
# in `src/netz/http.rs` benutzt — herausgeloest, damit `holes` ihn ueber TLS
# fahren kann, ohne dass an ihm etwas geaendert werden musste.
#
# Und nein, das bricht die Regel oben nicht: Verboten ist die Abhaengigkeit
# vom KERNEL (`speed_os`), nicht die von einer Protokoll-Bibliothek.
# `speedhttp` hat selbst keine Abhaengigkeiten, kennt keinen Syscall und
# keinen Socket — es zerlegt Bytes.
speedhttp = { path = "../speedhttp" }

# DAS WIDGET-TOOLKIT (Serie 8, Teil 2). Dieselbe Ueberlegung wie bei
# speedhttp: Verboten ist die Abhaengigkeit vom KERNEL, nicht die von einer
# wirtsfreien Bibliothek. speedui hat selbst KEINE Abhaengigkeiten und kennt
# weder Syscall noch Framebuffer — was es braucht (Thema, Schrift, Uhr,
# Leinwand), VERLANGT es als Trait, und `uidemo` liefert es.
speedui = { path = "../speedui" }

# DER HTML-PARSER (Serie 8, Teil 4) — dieselbe Ueberlegung wie bei
# `speedhttp` und `speedui`: Verboten ist die Abhaengigkeit vom KERNEL,
# nicht die von einer wirtsfreien Bibliothek. `speedhtml` hat selbst
# KEINE Abhaengigkeiten und kennt weder Netz noch Fenster.
speedhtml = { path = "../speedhtml" }

# CSS (Serie 8, Teil 5). Haengt selbst nur an speedhtml — die Begruendung
# fuer diese EINE Abhaengigkeit steht in speedcss/Cargo.toml.
speedcss = { path = "../speedcss" }

# Der Heap-Allocator des User-Space (Serie 7, Teil 3) — dieselbe Kiste, die
# auch der Kernel benutzt (src/allocator.rs). Sie ist no_std und kann
# `extend`, und genau das braucht ein Heap, der auf Anforderung waechst.
linked_list_allocator = { version = "0.10", default-features = false }
# Spinlock fuer den GlobalAlloc (der muss `Sync` sein). Ein SpeedOS-Prozess
# hat einen Ausfuehrungsstrang — der Lock ist nie umkaempft.
spin = { version = "0.9", default-features = false, features = ["spin_mutex"] }

# --- TLS (Serie 7, Teil 3) ---
# rustls OHNE std: `custom-provider` schaltet den eingebauten
# aws-lc-rs/ring-Anbieter ab (beide bringen C-Code mit). Der Anbieter kommt
# aus RustCrypto — reines Rust, no_std.
rustls = { version = "0.23", default-features = false, features = ["custom-provider", "tls12"] }
# `tls12` GEHOERT DAZU, und das ist eine in Teil 4 teuer gelernte Lektion:
# Ohne dieses Feature liefert der Anbieter NUR die drei TLS-1.3-Suiten (so
# war es in Teil 3, daher die Zahl 3 in der Bestandsaufnahme). Ein Server,
# der kein TLS 1.3 kann — und davon gibt es reichlich, u. a. saemtliche
# badssl.com-Testendpunkte — antwortet dann mit `HandshakeFailure`, BEVOR er
# ueberhaupt ein Zertifikat schickt. Man bekommt also nie zu sehen, was mit
# dem Zertifikat los ist, und haelt einen Aushandlungs-Fehlschlag faelschlich
# fuer eine bestandene Pruefung. Mit `tls12` sind es neun Suiten.
rustls-rustcrypto = { version = "0.0.2-alpha", default-features = false, features = ["alloc", "tls12"] }
# getrandom kennt x86_64-unknown-none nicht (und kann es nicht — es weiss
# nichts von SpeedOS). Das `custom`-Backend ist genau dafuer da: Wir liefern
# die Implementierung (libspeed::tls, ueber Syscall 12).
getrandom = { version = "0.2", default-features = false, features = ["custom"] }

# --- BILDER (Serie 8, Teil 3) ---
# Die Auswertung steht in docs/bild-entscheidung.md. Kurz: zune-png und
# zune-jpeg sind die EINZIGEN der geprueften Kisten, die gegen
# x86_64-unknown-none ueberhaupt uebersetzen (`png` und `jpeg-decoder`
# brauchen std). Beide sind no_std + alloc, beide liefern die drei
# Operationen, auf denen unsere Verteidigung steht: `decode_headers`,
# `output_buffer_size` und `decode_into` — Kopf lesen, Grenze pruefen,
# in UNSEREN Puffer schreiben.
#
# BEIDE IN VERSION 0.5, und das ist kein Schoenheitswunsch: zune-jpeg 0.4
# haengt an zune-core 0.4, zune-png 0.5 an zune-core 0.5. Gemischt liege
# derselbe Unterbau ZWEIMAL im Programm, und die `DecoderOptions` des einen
# waeren nicht die des anderen (der Compiler sagt es einem, aber erst spaet).
zune-png = { version = "0.5", default-features = false }
zune-jpeg = { version = "0.5", default-features = false }
# Der gemeinsame Unterbau beider — wir brauchen ihn direkt fuer
# `DecoderOptions` (die Grenzen!), `ZCursor` und `ColorSpace`.
zune-core = { version = "0.5", default-features = false }

[lib]
name = "libspeed"
path = "src/lib.rs"

# Die ersten drei echten SpeedOS-Programme.
[[bin]]
name = "hallo"
path = "src/bin/hallo.rs"

[[bin]]
name = "kopiere"
path = "src/bin/kopiere.rs"

[[bin]]
name = "netzhole"
path = "src/bin/netzhole.rs"

# Die beiden Haelften des Pipe-Beweises (Serie 6, Teil 6):
# `starte zaehle 20 | filter 7`
[[bin]]
name = "zaehle"
path = "src/bin/zaehle.rs"

[[bin]]
name = "filter"
path = "src/bin/filter.rs"

# Der Ring-3-Beweis fuer starte()/warte(): ein Prozess startet einen anderen.
[[bin]]
name = "elternprobe"
path = "src/bin/elternprobe.rs"

# DER GEGNER (Serie-6-Abschluss): ein absichtlich boeswilliges Programm.
# Es gehoert ins Repository, weil jede Sicherheitszusage bis zu ihrer
# Pruefung nur eine Behauptung ist — siehe tests/sicherheit.rs.
[[bin]]
name = "angreifer"
path = "src/bin/angreifer.rs"

# Leistungsmessung — bewusst aus Ring 3, damit der echte Weg gemessen wird.
[[bin]]
name = "messung"
path = "src/bin/messung.rs"

# Der Vertrauensanker, sichtbar gemacht (Serie 7, Teil 2).
[[bin]]
name = "zertifikate"
path = "src/bin/zertifikate.rs"

# Der TLS-Machbarkeitsnachweis (Serie 7, Teil 3): baut rustls ein und legt
# einen Client-Zustand an. KEIN Handshake — siehe docs/tls-entscheidung.md.
[[bin]]
name = "tlsspike"
path = "src/bin/tlsspike.rs"

# DER MEILENSTEIN VON SERIE 7 (Teil 4): eine echte verschluesselte
# Verbindung. TLS-Handshake ueber die Socket-Syscalls, Kette gegen den
# Vertrauensanker geprueft, Hostname abgeglichen, dann HTTP/1.1 mit dem
# UNVERAENDERTEN Parser aus Serie 5 darueber.
[[bin]]
name = "holes"
path = "src/bin/holes.rs"

# Der Beweis, dass die Abrufschicht traegt (Serie 7, Teil 5): eine Seite
# holen und als Text zeigen. Der Netz-Teil sind drei Zeilen; der Rest ist
# Textaufbereitung. AUSDRUECKLICH KEIN HTML-Renderer.
[[bin]]
name = "news"
path = "src/bin/news.rs"

# DER MEILENSTEIN VON SERIE 8 (Teil 1): ein Ring-3-Prozess mit einem
# EIGENEN FENSTER. Malt einen Verlauf, reagiert auf Klicks und Tasten,
# folgt Groessenaenderungen, beendet sich beim Schliessen-Wunsch.
[[bin]]
name = "fenstertest"
path = "src/bin/fenstertest.rs"

# DER BEWEIS DER TOOLKIT-TRENNUNG (Serie 8, Teil 2): dieselben Widgets wie
# im Kernel, aber in einem unprivilegierten Prozess — mit einem eigenen
# Wirt (Thema, Schrift, Uhr, Leinwand).
[[bin]]
name = "uidemo"
path = "src/bin/uidemo.rs"

# DER BEWEIS DER BILD-KETTE (Serie 8, Teil 3): PNG/JPEG von der Platte,
# dekodiert in Ring 3, angezeigt im eigenen Fenster, zoombar.
[[bin]]
name = "bilder"
path = "src/bin/bilder.rs"

# DAS WERKZEUG FUER DIE FEHLERSUCHE (Serie 8, Teil 4): den geparsten
# HTML-Baum eingerueckt ausgeben. Beantwortet bei jeder spaeteren
# Layout-Merkwuerdigkeit die erste Frage — Parser oder Layout?
[[bin]]
name = "htmldump"
path = "src/bin/htmldump.rs"

# DAS ZWEITE DEBUG-WERKZEUG (Serie 8, Teil 5): Welche Regel hat diesen
# Wert gesetzt? `htmldump` beantwortet „Parser oder Layout?", `cssdump`
# beantwortet „warum ist das Ding blau?".
[[bin]]
name = "cssdump"
path = "src/bin/cssdump.rs"

# panic = "abort" ist Pflicht: Abwickeln (unwinding) bräuchte eine
# Personality-Funktion und Landing Pads — beides gibt es ohne std nicht.
# Ein panickendes SpeedOS-Programm beendet sich per exit(101).
[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = "s"   # klein: die Programme wandern ins Kernel-Image
lto = true
codegen-units = 1
strip = "debuginfo"
