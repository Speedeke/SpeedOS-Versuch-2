<!--
  stilgrenze.html - die Pruefseite fuer die Obergrenze (Serie 9, Teil 1)

  ZWOELF <link>-Verweise auf Dateien, die es nicht gibt. Zwei Dinge
  muessen dabei herauskommen, und beide sind Zusagen:

    (1) Es werden hoechstens MAX_BLAETTER = 10 VERSUCHT, die uebrigen
        zwei werden uebersprungen und GEZAEHLT.
    (2) Zwoelf fehlgeschlagene Stylesheets verhindern die Seite NICHT.
        Der Text steht da, als waere nichts gewesen.

  Die zweite ist die wichtigere. Ein Browser, bei dem ein fehlendes
  Blatt die Seite kostet, ist auf einer schlechten Leitung unbenutzbar.

  Die Namen sind absichtlich so unwahrscheinlich, dass sie auch dann
  nicht existieren, wenn jemand die Seite in einen echten Ordner legt.
-->
