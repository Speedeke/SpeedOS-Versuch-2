# Cargo.toml — Projekt-Manifest von SpeedOS
#
# Hier stehen alle Abhängigkeiten (Crates) und die Konfiguration für
# das `bootimage`-Tool, das aus unserem Kernel ein bootfähiges
# Festplatten-Image baut und QEMU mit den richtigen Optionen startet.

[package]
name = "speed_os"
version = "0.1.0"
edition = "2021"

# Das boot/-Verzeichnis ist ein eigenständiges HOST-Programm (baut das
# Disk-Image und startet QEMU) — es gehört nicht zu unserem Kernel-
# Workspace, sonst würde cargo es fürs Bare-Metal-Target mitbauen.
[workspace]
exclude = ["boot"]

[dependencies]
# Die Kernel-Seite des Bootloaders (seit 0.11 aufgeteilt):
# bootloader_api liefert entry_point!, BootInfo und die Config —
# das Disk-Image baut das separate Host-Programm in boot/.
bootloader_api = "0.11"

# "volatile" verhindert, dass der Compiler unsere Schreibzugriffe auf den
# VGA-Speicher wegoptimiert (er sieht ja nicht, dass die Hardware mitliest).
volatile = "0.2.6"

# Spinlocks: einfache Mutexe, die ohne Betriebssystem funktionieren
# (wir KÖNNEN ja keine OS-Mutexe benutzen — wir SIND das OS).
spin = "0.5.2"

# Abstraktionen für x86_64-Spezialbefehle (Port-I/O, hlt, ...).
x86_64 = "0.14.2"

# Treiber für den seriellen UART-Chip 16550 (COM1 auf Port 0x3F8).
# Darüber schicken wir alle Debug-Ausgaben ins Terminal.
uart_16550 = "0.2.0"

# Treiber für den 8259 PIC (Programmable Interrupt Controller) —
# das Bauteil, das Hardware-Interrupts (Timer, Tastatur, ...) an die
# CPU weiterleitet.
pic8259 = "0.10.1"

# Übersetzt rohe Tastatur-Scancodes in Zeichen — inklusive
# deutschem QWERTZ-Layout mit Umlauten.
pc-keyboard = "0.7.0"

# Unser Standard-Heap-Allocator: verwaltet freie Speicherblöcke in
# einer verketteten Liste (siehe src/allocator.rs für die Alternativen).
linked_list_allocator = "0.9.0"

# Lock-freie Queue (ArrayQueue) für Scancodes: darf im Interrupt-
# Handler benutzt werden, weil push/pop NIE blockieren oder locken.
crossbeam-queue = { version = "0.3", default-features = false, features = ["alloc"] }

# OnceCell: einmalige, explizite Initialisierung von Statics —
# im Gegensatz zu lazy_static passiert die Initialisierung NICHT
# heimlich beim ersten Zugriff (der könnte im Interrupt-Handler sein!).
conquer-once = { version = "0.4", default-features = false }

# Async-Werkzeuge: Stream-Trait (asynchroner Iterator) und AtomicWaker
# (interrupt-sicherer Aufbewahrungsort für den Waker).
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

# Vorgerenderter Bitmap-Font (Noto Sans Mono) für den Framebuffer:
# pure Rust (const-Arrays, kein Datei-Parsing wie bei PSF), mit
# Antialiasing-Intensitäten vorgerastert — und der Latin-1-Block
# liefert unsere Umlaute (ä ö ü ß). Größe 16 = Konsole/UI-Skala 1.0,
# 24 = UI-Skala 1.5, 32 = UI-Skala 2.0 + Boot-Screen-Schriftzug.
noto-sans-mono-bitmap = { version = "0.3.2", default-features = false, features = [
    "regular",
    "bold",
    "size_16",
    "size_24",
    "size_32",
    "unicode-basic-latin",
    "unicode-latin-1-supplement",
] }

[features]
# Standard: unser EIGENES TCP (siehe tcp-eigen unten).
default = ["tcp-eigen"]

# DER REISSLEINEN-SCHALTER (docs/tcp-scope.md): `tcp-eigen` waehlt unsere
# selbstgebaute TCP-Schicht hinter der Socket-API. Die Messung vom Juli 2026
# hat das Kriterium erfuellt, also ist sie der Standard geblieben. Der
# Schalter markiert die Stelle, an der eine Fremd-Implementierung (smoltcp)
# eingehaengt WUERDE — die unteren Schichten (Ethernet/ARP/IPv4/ICMP/UDP/
# DHCP/DNS) und die Socket-API blieben davon in jedem Fall unberuehrt.
tcp-eigen = []

# Zum Lernen: alternative Heap-Allocatoren (Standard ist der
# linked_list_allocator). Aktivieren mit z. B.:
#   cargo test --features bump-allocator
bump-allocator = []
fixed-block-allocator = []

# lazy_static erlaubt statische Variablen, die erst beim ersten Zugriff
# initialisiert werden. "spin_no_std" nutzt Spinlocks statt OS-Mutexe.
[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

# (QEMU-Start und Test-Exit-Codes regelt jetzt der Runner in boot/ —
#  die frühere [package.metadata.bootimage]-Sektion ist Geschichte.)

# Der Stack-Overflow-Test braucht kein Test-Framework (harness):
# Er besteht aus einem einzigen Ablauf mit eigener Test-IDT.
[[test]]
name = "stack_overflow"
harness = false

# Der Async-Test steuert den Executor selbst und beendet QEMU
# aus einem Task heraus — auch ohne Test-Framework.
[[test]]
name = "async_task"
harness = false

# Der Kernel läuft auch im dev-Profil OPTIMIERT (opt-level 2): Der
# Compositor schiebt pro Frame Millionen Pixel durch Zeichner::pixel —
# unoptimiert dauert ein Frame hunderte Millisekunden (Maus-Lag!).
# Debug-Infos, Overflow-Checks und debug_assert! bleiben aktiv, nur
# der Codegen wird scharf gestellt.
[profile.dev]
opt-level = 2

# Abhängigkeiten (Font-Rasterizer!) ebenfalls optimiert bauen:
[profile.dev.package."*"]
opt-level = 2
